events {}
http { server { listen 80;
  location ~ ^/(api/(admin|kitchen)|staff) { proxy_pass http://backoffice:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { proxy_pass http://ordering:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; } } }
