<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outlet 451</title><style>
:root{--b:#1d4ed8;--bd:#1e40af;--g:#64748b;--l:#e2e8f0}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#0f172a}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#fff;z-index:5}
h1{font-size:20px;letter-spacing:.2em;margin:0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:2fr 1fr}}
button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}button:hover{background:var(--bd)}
button.o{background:#fff;color:var(--b);border:1px solid var(--b)}button:disabled{opacity:.5}
input,select{padding:10px;border:1px solid var(--l);border-radius:10px;width:100%;margin:4px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{border:1px solid var(--l);border-radius:14px;padding:14px;box-shadow:0 1px 3px #0001}.card p{color:var(--g);font-size:13px;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}h2{font-size:15px;color:var(--g);text-transform:uppercase;letter-spacing:.1em}
#err{color:#b91c1c;font-size:14px}.pill{background:#dbeafe;color:var(--bd);border-radius:99px;padding:2px 10px;font-size:12px}
</style></head><body>
<header><h1>OUTLET 451</h1><div id="acct"></div></header>
<main><section id="menu"></section><aside><div class="card" id="cart"></div><div id="err"></div><h2>My orders</h2><div id="orders"></div></aside></main>
<script>
const $=s=>document.querySelector(s);let me=null,menu=[],cart={},editing=null;
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});
 const d=r.status==204?{}:await r.json();if(!r.ok)throw Error(d.error||'Error');return d};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),err=m=>$('#err').textContent=m||'';
async function init(){try{me=await api('me')}catch{me=null}menu=await api('menu');draw();if(me)loadOrders()}
function draw(){
 $('#acct').innerHTML=me?`${esc(me.name)} <span class="pill">${me.points} pts</span> <button class="o" onclick="logout()">Log out</button>`:`<button onclick="auth()">Sign in</button>`;
 const cats=[...new Set(menu.map(m=>m.category))];
 $('#menu').innerHTML=cats.map(c=>`<h2>${esc(c)}</h2><div class="grid">`+menu.filter(m=>m.category==c).map(m=>`<div class="card"><b>${esc(m.name)}</b><p>${esc(m.description)}</p>
  <div class="row"><span>$${m.final_price.toFixed(2)}${m.discount_pct?` <span class="pill">-${m.discount_pct}%</span>`:''}</span>
  <button ${m.available?'':'disabled'} onclick="add(${m.id},1)">${m.available?'Add':'Sold out'}</button></div></div>`).join('')+'</div>').join('');
 drawCart()}
function drawCart(){const ids=Object.keys(cart);let sub=0;
 const rows=ids.map(i=>{const m=menu.find(x=>x.id==i);sub+=m.final_price*cart[i];return`<div class="row"><span>${esc(m.name)}</span><span><button class="o" onclick="add(${i},-1)">-</button> ${cart[i]} <button class="o" onclick="add(${i},1)">+</button></span></div>`}).join('');
 $('#cart').innerHTML=`<h2>${editing?'Editing #'+editing:'Your cart'}</h2>${rows||'<p>Cart is empty</p>'}<div class="row"><b>Subtotal</b><b>$${sub.toFixed(2)}</b></div>
 <small>+5% tax</small>${editing?'':`<select id="pm"><option value="cash">Cash</option><option value="card">Card (token)</option><option value="bkash">bKash (TrxID)</option></select>
 <input id="tok" placeholder="Card token / bKash TrxID (not for cash)"><input id="rp" type="number" min="0" placeholder="Points to redeem (1 pt = $0.05)">`}
 <button style="width:100%;margin-top:8px" ${ids.length?'':'disabled'} onclick="checkout()">${editing?'Save changes':'Checkout'}</button>${editing?'<button class="o" style="width:100%;margin-top:6px" onclick="editing=null;cart={};drawCart()">Discard edit</button>':''}`}
function add(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];drawCart()}
async function checkout(){err();if(!me)return auth();const items=Object.entries(cart).map(([i,q])=>({item_id:+i,qty:q}));
 try{if(editing)await api('orders/'+editing,'PUT',{items});else{await api('orders','POST',{items,method:$('#pm').value,token:$('#tok').value,redeem_points:+$('#rp').value||0})}
  cart={};editing=null;me=await api('me');menu=await api('menu');draw();loadOrders()}catch(e){err(e.message)}}
async function loadOrders(){const os=await api('orders');
 $('#orders').innerHTML=os.map(o=>`<div class="card"><div class="row"><b>#${o.id}</b><span class="pill">${o.status}</span></div>${o.items.map(i=>`${i.qty} x ${esc(i.name)}`).join('<br>')}
 <div class="row"><b>$${o.total.toFixed(2)}</b> <a href="/api/orders/${o.id}/receipt" target="_blank">Receipt</a>${o.edit_seconds_left?`<span><button class="o" onclick='edit(${JSON.stringify(o.id)},${JSON.stringify(o.items)})'>Edit</button> <button class="o" onclick="cancel(${o.id})">Cancel</button></span><small>${o.edit_seconds_left}s left</small>`:''}</div></div>`).join('')}
function edit(id,items){editing=id;cart={};items.forEach(i=>cart[i.item_id]=i.qty);drawCart()}
async function cancel(id){try{await api('orders/'+id,'DELETE');me=await api('me');menu=await api('menu');draw();loadOrders()}catch(e){err(e.message)}}
function auth(){$('#cart').innerHTML=`<h2>Sign in / register</h2><input id="n" placeholder="Name (register only)"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (8+)">
 <button onclick="go('login')">Sign in</button> <button class="o" onclick="go('register')">Register</button>`}
async function go(k){try{await api(k,'POST',{name:$('#n').value,email:$('#e').value,password:$('#p').value});init()}catch(e){err(e.message)}}
async function logout(){await api('logout','POST');me=null;cart={};$('#orders').innerHTML='';draw()}
init();
</script></body></html>
